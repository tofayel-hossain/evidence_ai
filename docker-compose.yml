version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: evidenceai-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: evidenceai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evidenceai"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: evidenceai-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword2026@postgres:5432/evidenceai
      - ENVIRONMENT=production
      - DEBUG=False
      - LLM_PROVIDER=fallback
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/indices:/app/data/indices
      - ./data/benchmark:/app/data/benchmark

volumes:
  pgdata:
